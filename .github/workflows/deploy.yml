# Superseded by Cloudflare Pages (project: pc-quanti) on 2026-08-20.
# pcquanti.co.za and www.pcquanti.co.za are served from Cloudflare Pages, which
# builds directly from this repository on every push to main.
#
# This workflow is retained for rollback only and no longer runs automatically.
# To fall back to GitHub Pages: restore the DNS records below in Cloudflare, then
# run this workflow manually from the Actions tab.
#   A     @    185.199.108.153, 185.199.109.153, 185.199.110.153, 185.199.111.153
#   CNAME www  jonathanavis96.github.io
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with Next.js
        run: npm run build
        env:
          USE_GITHUB_PAGES: 'false'
          NEXT_PUBLIC_FORMSPREE_FORM_ID: ${{ secrets.FORMSPREE_FORM_ID }}
          NEXT_PUBLIC_SITE_URL: https://pcquanti.co.za

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
